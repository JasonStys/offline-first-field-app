# File: codeql.yml
# Purpose: Analyze platform-neutral C# source using an explicit release build.
name: CodeQL

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
  pull_request:
  schedule:
    - cron: "19 7 * * 2"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze C#
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.401
      - name: Initialize CodeQL
        uses: github/codeql-action/init@e34fc2711fb7964ca6850c8a8382121f34745f3b # v4.32.4
        with:
          languages: csharp
      - name: Restore dependencies
        run: dotnet restore FieldOps.CI.slnx --locked-mode
      - name: Build analyzed source
        run: dotnet build FieldOps.CI.slnx -c Release --no-restore
      - name: Analyze
        uses: github/codeql-action/analyze@e34fc2711fb7964ca6850c8a8382121f34745f3b # v4.32.4
