# File: codeql.yml
# Purpose: Preserve platform-neutral analysis and independently extract the actual Windows MAUI client.
name: CodeQL

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
  pull_request:
  schedule:
    - cron: "19 7 * * 2"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze C#
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up .NET 10
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.404
      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.0; coordinated version
        with:
          languages: csharp
      - name: Restore dependencies
        run: dotnet restore FieldOps.CI.slnx --locked-mode
      - name: Build analyzed source
        run: dotnet build FieldOps.CI.slnx -c Release --no-restore
      - name: Analyze
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.0; coordinated version

  analyze-windows:
    name: Analyze actual Windows MAUI client C#
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up current .NET10 SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.404
      - name: Install Windows MAUI build workload
        run: dotnet workload install maui-windows
      - name: Initialize real Windows C# extraction
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.0; coordinated version
        with:
          languages: csharp
          build-mode: manual
          queries: security-extended
      - name: Restore actual client/native reference graph
        run: dotnet restore src/FieldOps.App/FieldOps.App.csproj --locked-mode -p:NativeWindowsOnly=true -r win-x64 -p:SelfContained=true -p:WindowsAppSDKSelfContained=true -p:FieldOpsNativeRuntimeVersion=10.0.15
      - name: Build actual MAUI and WinUI source under CodeQL
        run: dotnet build src/FieldOps.App/FieldOps.App.csproj -c Release -f net10.0-windows10.0.19041.0 -r win-x64 --self-contained --no-restore --no-incremental -p:NativeWindowsOnly=true -p:WindowsAppSDKSelfContained=true -p:FieldOpsNativeRuntimeVersion=10.0.15
      - name: Analyze extracted native client and companion
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.0; coordinated version
