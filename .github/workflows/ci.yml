# File: ci.yml
# Purpose: Verify C#, SQLite, API, performance, publish artifacts, and both MAUI platform targets.
name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core, database, API, and evidence
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.401
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - name: Run complete platform-neutral gate
        run: bash scripts/verify.sh
      - name: Smoke-test published API
        shell: bash
        run: |
          dotnet artifacts/api/FieldOps.Api.dll --urls http://127.0.0.1:5080 > artifacts/api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:5080/healthz; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: core-validation
          path: |
            artifacts
            docs/reports
          if-no-files-found: error

  windows-client:
    name: Windows MAUI release build
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.401
      - name: Restore MAUI workloads
        run: dotnet workload install maui-windows
      - name: Restore Windows client
        shell: pwsh
        run: |
          dotnet restore FieldOps.CI.slnx --locked-mode
          dotnet restore src/FieldOps.App/FieldOps.App.csproj --no-dependencies -p:TargetFrameworks=net10.0-windows10.0.19041.0 -r win-x64
      - name: Build unpackaged Windows x64 client
        run: dotnet build src/FieldOps.App/FieldOps.App.csproj -c Release -f net10.0-windows10.0.19041.0 -r win-x64 --no-self-contained --no-restore -p:TargetFrameworks=net10.0-windows10.0.19041.0

  android-client:
    name: Android MAUI release build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.401
      - name: Restore MAUI workloads
        run: dotnet workload install maui-android
      - name: Restore Android client
        run: dotnet restore src/FieldOps.App/FieldOps.App.csproj
      - name: Build Android client
        run: dotnet build src/FieldOps.App/FieldOps.App.csproj -c Release -f net10.0-android --no-restore

  container:
    name: Non-root API container
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build container
        run: docker build --tag fieldops-api:validation .
      - name: Verify non-root runtime user
        run: test "$(docker run --rm --entrypoint id fieldops-api:validation -u)" != "0"
